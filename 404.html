<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z"/></symbol>
</svg>
<header class="site-header is-dark">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="Gemini Digital Solution home">
      <picture><source type="image/avif" srcset="/assets/images/logo-mark-96.avif"><img src="/assets/images/logo-mark-96.webp" width="44" height="39" alt="Gemini Digital Solution logo"></picture>
      <span class="brand-text" aria-hidden="true"><span class="brand-name">GEMINI</span><span class="brand-sub">DIGITAL SOLUTION</span></span>
    </a>
    <div class="header-actions">
      <button class="icon-btn theme-toggle" type="button" aria-label="Switch to dark theme">
        <svg class="i-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        <svg class="i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
      </button>
    </div>
  </div>
</header>
<main id="main" class="hero is-dark notfound">
  <div class="hero-bg" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span><span class="hero-grid"></span></div>
  <div class="notfound-inner">
    <div class="hero-visual" aria-hidden="true">
      <svg class="twin" viewBox="0 0 400 400" focusable="false">
        <defs><linearGradient id="n-stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#1C5FD6"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient></defs>
        <circle cx="200" cy="200" r="178" fill="none" stroke="#9AA8CC" stroke-opacity=".22" stroke-dasharray="2 9"/>
        <circle cx="158" cy="200" r="108" fill="#22D3EE" fill-opacity=".05" stroke="url(#n-stroke)" stroke-width="2"/>
        <circle cx="242" cy="200" r="108" fill="#7C5CFF" fill-opacity=".06" stroke="url(#n-stroke)" stroke-width="2"/>
        <g class="orbit"><circle cx="200" cy="22" r="8" fill="#22D3EE"/><circle cx="200" cy="378" r="8" fill="#9C85FF"/></g>
        <g class="spark"><path d="M200 180l5 15 15 5-15 5-5 15-5-15-15-5 15-5z" fill="#F5C26B"/></g>
      </svg>
    </div>
    <p class="code grad-text">404</p>
    <h1 class="section-title">One of the twins wandered off.</h1>
    <p class="hero-lead">The page you are looking for does not exist or has moved. Let's get you back on track.</p>
    <div class="cta-row">
      <a class="btn btn-primary btn-glow" href="/">Back to the home page <svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
      <a class="btn btn-ghost" href="/#contact">Contact our team</a>
    </div>
  </div>
</main>
</body>
</html>
