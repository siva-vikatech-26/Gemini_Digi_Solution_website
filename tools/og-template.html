<!doctype html>
<html lang="en" data-theme="dark" class="js"><head><meta charset="utf-8"><title>OG image template</title>
<style>
@font-face{font-family:"Montserrat";src:url("../assets/fonts/montserrat-latin-var.woff2") format("woff2");font-weight:500 900}
@font-face{font-family:"Inter";src:url("../assets/fonts/inter-latin-var.woff2") format("woff2");font-weight:400 700}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;color:#EAF0FF;background:radial-gradient(90% 90% at 20% 0%,#0B1B4D,#050A1C 65%)}
.o{position:absolute;border-radius:50%}
.o1{width:900px;height:900px;left:-300px;top:-450px;background:radial-gradient(closest-side,rgba(28,95,214,.7),transparent)}
.o2{width:800px;height:800px;right:-260px;top:-160px;background:radial-gradient(closest-side,rgba(124,92,255,.55),transparent)}
.o3{width:600px;height:600px;left:380px;bottom:-420px;background:radial-gradient(closest-side,rgba(34,211,238,.4),transparent)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(154,168,204,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(154,168,204,.07) 1px,transparent 1px);background-size:56px 56px}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:64px}
.bn{font-family:Montserrat;font-weight:800;font-size:30px;letter-spacing:.16em}
.bs{font-size:14px;font-weight:600;letter-spacing:.3em;color:#9AA8CC;margin-top:4px}
h1{font-family:Montserrat;font-weight:800;font-size:76px;line-height:1.02;letter-spacing:-.035em;max-width:720px}
h1 span{background:linear-gradient(120deg,#22D3EE,#4C8DFF 50%,#9C85FF);-webkit-background-clip:text;color:transparent}
.tags{display:flex;gap:12px;flex-wrap:wrap}
.tags b{padding:10px 18px;border-radius:999px;border:1px solid rgba(154,168,204,.3);background:rgba(15,27,61,.7);font-weight:600;font-size:18px}
.loc{font-size:20px;color:#9AA8CC}
svg{position:absolute;right:40px;top:110px;width:440px;height:440px}
</style></head><body>
<div class="o o1"></div><div class="o o2"></div><div class="o o3"></div><div class="grid"></div>
<svg viewBox="0 0 400 400"><defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#1C5FD6"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient><radialGradient id="st"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#F5C26B" stop-opacity=".85"/><stop offset="1" stop-color="#F5C26B" stop-opacity="0"/></radialGradient></defs>
<circle cx="200" cy="200" r="178" fill="none" stroke="#9AA8CC" stroke-opacity=".25" stroke-dasharray="2 9"/>
<circle cx="158" cy="200" r="108" fill="#22D3EE" fill-opacity=".06" stroke="url(#s)" stroke-width="2"/>
<circle cx="242" cy="200" r="108" fill="#7C5CFF" fill-opacity=".07" stroke="url(#s)" stroke-width="2"/>
<circle cx="80" cy="74" r="8" fill="#22D3EE"/><circle cx="320" cy="326" r="8" fill="#9C85FF"/>
<circle cx="200" cy="200" r="46" fill="url(#st)"/><path d="M200 180l5 15 15 5-15 5-5 15-5-15-15-5 15-5z" fill="#FFF6E3"/></svg>
<div class="wrap">
  <div class="brand"><img src="../assets/images/logo-mark-192.webp" alt=""><div><div class="bn">GEMINI</div><div class="bs">DIGITAL SOLUTION</div></div></div>
  <h1>Software that <span>thinks</span> with your team.</h1>
  <div>
    <div class="tags"><b>AI CRM</b><b>Web apps</b><b>Chatbots &amp; AI agents</b><b>Workflow automation</b></div>
    <p class="loc" style="margin-top:20px">AI development company · Trichy &amp; Chennai, Tamil Nadu</p>
  </div>
</div>
</body></html>
